name: 🚀 Auto-generate & deploy blog

on:
  # Scheduled: Monday and Thursday at 9:00 UTC
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 9 * * 4'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Enable pnpm
      - name: 🔧 Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      # 3️⃣ Setup Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4️⃣ Install dependencies
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣ Generate blog index
      - name: 📝 Generate blog index
        run: node scripts/update-blog-index.js


      # 6️⃣ Commit updated index.astro if changes exist
      - name: ⚙️ Commit updated blog index
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Blog Index Generator)"
          git add src/pages/blog/index.astro
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "📝 Auto-update blog index - $(date +'%Y-%m-%d')"
            git push origin HEAD
            echo "✅ Committed updated index.astro"
          fi

      # 7️⃣ Build site
      - name: 🏗️ Build site
        run: pnpm run build

      # 8️⃣ Deploy to Netlify
      - name: 🌐 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist'
          production-deploy: true
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          deploy-message: "🚀 Auto-generated blog index - $(date +'%Y-%m-%d')"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # 9️⃣ Summary
      - name: 📊 Summary
        run: |
          echo "📊 Blog auto-generation completed"
          echo "Date: $(date)"
          echo "Check Netlify for the latest deployed site"
