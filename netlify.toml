[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist"
  
  # Build environment variables
  environment = { NODE_VERSION = "18", PNPM_VERSION = "8.15.5" }

[build.processing]
  # Let Netlify handle some optimizations
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# FIXED: Enhanced headers for security, caching, and performance
[[headers]]
  for = "/*"
  [headers.values]
    # FIXED: Enhanced Security Headers
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.google-analytics.com https://www.clarity.ms https://scripts.clarity.ms https://analytics.ahrefs.com https://unpkg.com https://cdn-cookieyes.com https://www.cookieyes.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.clarity.ms https://scripts.clarity.ms https://f.clarity.ms https://n.clarity.ms https://i.clarity.ms https://analytics.ahrefs.com https://cdn-cookieyes.com https://www.cookieyes.com https://log.cookieyes.com; frame-src 'self' https://www.google.com https://www.cookieyes.com; object-src 'none'; base-uri 'self';"
    # FIXED: Performance headers
    X-DNS-Prefetch-Control = "on"
    Accept-CH = "DPR, Viewport-Width, Width"
    
    # FIXED: Better cache control
    Cache-Control = "public, max-age=0, must-revalidate"
    Vary = "Accept-Encoding"

# FIXED: Static assets - more aggressive caching with immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Vary = "Accept-Encoding"

# FIXED: Images - optimized caching with better headers
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    Vary = "Accept"
    Accept-Ranges = "bytes"

# FIXED: Fonts - long term caching with better performance
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Content-Type = "font/woff2"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Content-Type = "font/woff"

# FIXED: Favicon and manifest with proper content types
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# FIXED: HTML pages - optimized caching strategy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, stale-while-revalidate=86400"
    Vary = "Accept-Encoding"

# FIXED: SEO files with proper content types
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

# FIXED: Service Worker with no-cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# API routes (if any)
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

